<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A45">
<title>Piano Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F8; --ink:#262A3F; --ink-2:#5D627A; --ink-3:#868CA3;
  --line:#E4E6EF; --edge:#D6D9E5;
  --accent:#FF7A45; --accent-d:#DE5A26; --accent-soft:#FFE9DE;
  --ok:#1FBF86; --ok-d:#16A06F; --ok-soft:#DDF7EC;
  --bad:#FF4D6D; --bad-d:#D93356; --bad-soft:#FFE1E7;
  --sky:#3BA8FF; --sky-d:#1F86DB; --sky-soft:#E0F1FF;
  --gold:#FFC23C; --gold-d:#E3A21A; --gold-soft:#FFF4D6;
  --grape:#8B6CFF; --grape-d:#6B4DE0;
  --key-w:#FFFFFF; --key-b:#262A3F;
  --r:20px; --r-s:14px;
  --display:"Rubik",system-ui,sans-serif; --text:"Rubik",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141725; --surface:#1C2033; --surface-2:#252A40; --ink:#F1F2F8; --ink-2:#B3B8CE; --ink-3:#7D839C;
  --line:#2C3149; --edge:#0E1019; --accent-soft:#3A2418; --ok-soft:#10352A; --bad-soft:#3D1824; --sky-soft:#142B44; --gold-soft:#3A3014;
  --key-w:#ECEEF6; --key-b:#0E1019;
}}
:root[data-theme="dark"]{
  --bg:#141725; --surface:#1C2033; --surface-2:#252A40; --ink:#F1F2F8; --ink-2:#B3B8CE; --ink-3:#7D839C;
  --line:#2C3149; --edge:#0E1019; --accent-soft:#3A2418; --ok-soft:#10352A; --bad-soft:#3D1824; --sky-soft:#142B44; --gold-soft:#3A3014;
  --key-w:#ECEEF6; --key-b:#0E1019;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--sky)}
.app{max-width:640px;margin:0 auto;padding:12px 16px 180px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
h1,.display{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.1}
h2{font-size:19px;font-weight:700}
.muted{color:var(--ink-2)} .small{font-size:15px} .tiny{font-size:13px;color:var(--ink-2)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
/* chunky 3D buttons */
.btn{--c:var(--surface-2);--d:var(--edge);--t:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:16px;font-weight:700;font-size:16px;letter-spacing:.02em;background:var(--c);color:var(--t);box-shadow:0 4px 0 var(--d);transform:translateY(0);transition:transform .08s,box-shadow .08s,filter .15s;text-transform:uppercase}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn-primary{--c:var(--sky);--d:var(--sky-d);--t:#fff}
.btn-accent{--c:var(--accent);--d:var(--accent-d);--t:#fff}
.btn-ok{--c:var(--ok);--d:var(--ok-d);--t:#fff}
.btn-ghost{--c:var(--surface);--d:var(--line);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-line{--c:var(--surface);--d:var(--line);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-block{width:100%}
.btn-sm{height:42px;padding:0 16px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok-d)} .pill.accent{background:var(--accent-soft);color:var(--accent-d)} .pill.bad{background:var(--bad-soft);color:var(--bad-d)} .pill.sky{background:var(--sky-soft);color:var(--sky-d)}
:root[data-theme="dark"] .pill.ok,:root[data-theme="dark"] .pill.accent{filter:brightness(1.6)}

/* top stats */
.statbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.stati{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.stati svg{width:24px;height:24px}
.stati.fire{color:var(--accent)} .stati.xp{color:var(--gold-d)} .stati.day{color:var(--sky)}

/* unit banner */
.unit{border-radius:var(--r);padding:16px 18px;color:#fff;background:var(--grape);box-shadow:0 4px 0 var(--grape-d);display:flex;align-items:center;gap:12px}
.unit .eyebrow{color:rgba(255,255,255,.8)}
.unit h2{font-size:21px;font-weight:800;margin-top:2px}
.unit p{font-size:14px;opacity:.9;margin-top:2px}
.unit .ubtn{flex:none;width:48px;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center}
.unit .ubtn svg{width:22px;height:22px}

/* path */
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:40px;padding:64px 0 120px}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--surface-2);box-shadow:0 7px 0 var(--edge);transition:transform .1s}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--edge)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.cur{background:var(--accent);box-shadow:0 7px 0 var(--accent-d);width:84px;height:78px}
.node.cur::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:6px solid var(--accent-soft)}
.node.locked{color:var(--ink-3)}
.node .lbl{position:absolute;bottom:-26px;font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.bubble{position:absolute;bottom:calc(100% + 18px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--accent);border:2px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;letter-spacing:.04em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}

/* week dots */
.week{display:flex;gap:6px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:700}
.wd b{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:transparent}
.wd.done b{background:var(--accent);color:#fff}
.wd.today b{box-shadow:0 0 0 2px var(--accent)}

.blocks{list-style:none}
.blocks li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:2px solid var(--surface-2)}
.blocks li:first-child{border-top:0}
.bn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;flex:none}
.bt{flex:1;min-width:0}
.bt b{display:block;font-weight:700;font-size:16px}
.bt span{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm{font-size:14px;font-weight:700;color:var(--ink-3)}
.gate-tag{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs-inner{max-width:440px;margin:0 auto;display:flex;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 14px;border-radius:14px;border:2px solid transparent}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--sky);background:var(--sky-soft);border-color:color-mix(in srgb,var(--sky) 40%,transparent)}
.startbar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));padding:0 16px 12px;z-index:19;pointer-events:none}
.startbar .btn{pointer-events:auto;max-width:608px;margin:0 auto;display:flex;height:56px}

/* plan */
.wk{margin-top:24px}
.wk .unit{margin-bottom:8px}
.dayrow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r-s);width:100%;text-align:left}
.dayrow:hover{background:var(--surface-2)}
.dnum{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;background:var(--surface-2);color:var(--ink-2)}
.dayrow.done .dnum{background:var(--gold);color:#fff}
.dayrow.cur .dnum{background:var(--accent);color:#fff}
.dayrow.locked{color:var(--ink-3)}
.dstat{font-size:13px;font-weight:700}
.daydetail{padding:2px 12px 14px 70px;font-size:14px;color:var(--ink-2)}
.daydetail li{margin:8px 0 8px 16px;line-height:1.55}

/* session */
.session{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto}
.s-top{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px}
.s-top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar{flex:1;height:18px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);position:relative;transition:width .4s ease}
.bar i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.s-title{max-width:760px;margin:6px auto 0;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-3)}
.timer{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:10px}
.timer.over{color:var(--accent-d);background:var(--accent-soft)}
.s-body{max-width:760px;margin:0 auto;padding:12px 16px 150px}
.how{list-style:none;counter-reset:h}
.how li{counter-increment:h;position:relative;padding-left:32px;margin:8px 0;color:var(--ink-2)}
.how li::before{content:counter(h);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:8px;background:var(--sky-soft);color:var(--sky-d);font-size:12px;font-weight:800;display:grid;place-items:center}
.howbox summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--sky);padding:4px 0;list-style:none}
.howbox summary::before{content:"+ "} .howbox[open] summary::before{content:"− "}
.s-foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:6}
.s-foot-inner{max-width:760px;margin:0 auto;display:flex;gap:10px}
.fbtn{height:56px;white-space:nowrap}
.grow{flex:1}
.btn-icon{width:56px;height:56px;padding:0;font-size:26px}
#check.live{--c:var(--bad);--d:var(--bad-d);--t:#fff}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-3)}
.linkbtn{color:var(--sky);font-weight:700;font-size:14px}

/* hero note */
.hero{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:background .15s,border-color .15s}
.hero.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.hero.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.hero-note{font-weight:800;font-size:72px;line-height:1;min-width:110px;display:flex;align-items:baseline;gap:10px}
.hero-note small{font-size:26px;font-weight:600;color:var(--ink-2)}
.hero-side{flex:1;min-width:0}
.hero-f{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:#fff;background:var(--sky);padding:6px 14px;border-radius:12px;box-shadow:0 3px 0 var(--sky-d)}
.hero-f:empty{display:none}
.hero-say{font-size:16px;font-weight:600;color:var(--ink-2);margin-top:8px}
.hero-say.bad{color:var(--bad-d)}
.meter{width:10px;height:56px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;flex:none}
.hero .meter{visibility:hidden} body.listening .hero .meter{visibility:visible}
.meter i{position:absolute;left:0;right:0;bottom:0;background:var(--ok);height:0;transition:height .06s}
.listen{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-s);background:var(--surface-2)}
.heard{font-size:30px;font-weight:800;min-width:84px}
.say{font-size:15px;font-weight:600}
.say.bad{color:var(--bad-d)} .say.ok{color:var(--ok-d)}

/* note strip */
.stripwrap{position:relative;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 32px),transparent)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 12px;scroll-behavior:smooth;scrollbar-width:none}
.strip::-webkit-scrollbar,.kbwrap::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:54px;padding:6px 6px 8px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);text-align:center;transition:all .15s}
.chip .f{font-size:12px;color:var(--sky);font-weight:800;height:15px}
.chip .l{font-weight:800;font-size:18px;line-height:1.2}
.chip .s{font-size:12px;font-weight:600;color:var(--ink-2)}
.chip.cur{background:var(--accent);border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d);color:#fff;transform:translateY(-3px)}
.chip.cur .s,.chip.cur .f{color:#fff}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)} .chip.ok .l{color:var(--ok-d)} .chip.ok .s{color:var(--ok-d)}
.chip.miss{border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.chip.wide{min-width:70px}
.chip .octd{font-size:10px;vertical-align:sub;opacity:.6}
.lmark{flex:none;width:3px;margin:8px 2px;border-radius:2px;background:var(--line)}

/* keyboard */
.kbwrap{overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.kb{position:relative;display:flex;height:170px;user-select:none;margin:0 auto;width:max-content;padding-bottom:4px}
.kw{position:relative;width:var(--kw,46px);height:100%;background:var(--key-w);border:2px solid var(--edge);border-radius:0 0 12px 12px;margin-right:-2px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;font-size:11px;font-weight:600;color:#6c7088;box-shadow:0 4px 0 var(--edge);transition:background .1s}
.kw b{font-size:14px;color:#262A3F;font-weight:800}
.kw.mc::after{content:"";position:absolute;bottom:46px;width:8px;height:8px;border-radius:50%;background:var(--sky)}
.kb_{position:absolute;top:0;width:calc(var(--kw,46px)*.62);height:60%;background:var(--key-b);border-radius:0 0 8px 8px;z-index:2;box-shadow:0 3px 0 #000;transition:background .1s}
.k-target{background:var(--accent)!important;color:#fff!important;border-color:var(--accent-d)!important}
.k-target b{color:#fff!important}
.k-ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok-d)!important}
.k-ok b{color:#fff!important}
.k-bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad-d)!important}
.k-bad b{color:#fff!important}
.k-hear{box-shadow:inset 0 -8px 0 var(--accent),0 4px 0 var(--edge)}

/* metronome */
.beats{display:flex;gap:8px;flex-wrap:wrap}
.beat{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--ink-2);transition:all .06s}
.beat.on{background:var(--sky);color:#fff;transform:scale(1.15)}
.beat.acc.on{background:var(--accent);color:#fff}
.bpm{font-size:40px;font-weight:800;min-width:72px;text-align:center}

/* self check */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:2px solid var(--surface-2);cursor:pointer;text-align:left;width:100%}
.check:first-child{border-top:0}
.box{width:28px;height:28px;border-radius:9px;border:2px solid var(--edge);flex:none;display:grid;place-items:center;box-shadow:0 2px 0 var(--edge)}
.check.on .box{background:var(--ok);border-color:var(--ok-d);box-shadow:0 2px 0 var(--ok-d)}
.check.on .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* result */
.result{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-s);border:2px solid}
.result .display{font-size:32px}
.result.ok{background:var(--ok-soft);border-color:var(--ok)} .result.ok .display{color:var(--ok-d)}
.result.bad{background:var(--bad-soft);border-color:var(--bad)} .result.bad .display{color:var(--bad-d)}
.result .small{color:var(--ink-2)}
.ring{width:170px;height:170px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:44px;font-weight:800;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:16px;border:2px solid var(--c);overflow:hidden;text-align:center;background:var(--surface)}
.stat span{display:block;background:var(--c);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.stat b{display:block;font-size:24px;font-weight:800;padding:10px 4px;color:var(--ink)}
.stat.gold{--c:#C98A00} .stat.ok{--c:var(--ok)} .stat.sky{--c:var(--sky)}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;padding:32px 16px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:24px;border-radius:5px}

select,input[type=range]{font:inherit;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--sky-d);box-shadow:0 2px 0 var(--line)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.vlink{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-s);border:2px solid var(--line);text-decoration:none;color:var(--ink);font-size:15px;font-weight:600}
.vlink svg{flex:none;color:#FF3B30}
.warnbar{font-size:14px;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-s);padding:10px 12px}
.tier{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-weight:800;font-size:14px;color:#fff;flex:none}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;color:var(--ink-2)}
.mini svg{width:20px;height:20px}
.songrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:2px solid var(--surface-2);width:100%;text-align:left}

<script>
"use strict";
/* =========================================================
   1. Notes, sargam, parsing
   ========================================================= */
const LETTERS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS={'C#':'Db','D#':'Eb','F#':'F#','G#':'Ab','A#':'Bb'};
const SARGAM=['Sa','re','Re','ga','Ga','Ma','MA','Pa','dha','Dha','ni','Ni'];
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
const nameToMidi=s=>{const r=/^([A-G])(#|b)?(-?\d)$/.exec(s);let pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1]];if(r[2]==='#')pc++;if(r[2]==='b')pc--;return 12*(+r[3]+1)+pc};
const letterOf=m=>{const l=LETTERS[((m%12)+12)%12];return FLATS[l]||l};
const octOf=m=>Math.floor(m/12)-1;
const midiName=m=>letterOf(m)+octOf(m);
function sargamOf(m){const s=SARGAM[((m%12)+12)%12];const o=octOf(m);if(o<4)return '.'.repeat(4-o)+s;if(o>4)return s+"'".repeat(o-4);return s}
// "C4 D4 E4:2" -> [{m,d}]
function parseNotes(str){return str.trim().split(/\s+/).map(t=>{const [n,d]=t.split(':');return {m:nameToMidi(n),d:d?+d:1}})}
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12)}

/* Fingering: dynamic programming over fingers 1-5. RH by default; LH mirrors intervals. */
const SPAN={'1,2':[1,5],'1,3':[2,7],'1,4':[3,8],'1,5':[4,9],'2,3':[1,3],'2,4':[2,5],'2,5':[3,7],'3,4':[1,2],'3,5':[2,4],'4,5':[1,2]};
function stepCost(m1,f1,m2,f2,lh,long){let d=m2-m1;if(lh)d=-d;
  if(d===0)return f1===f2?0:6;
  if(f1===f2)return long&&Math.abs(d)<=4?2.5:12;
  let c=0;const up=d>0,a=Math.abs(d);
  if(up&&f2>f1||!up&&f2<f1){const [lo,hi]=SPAN[Math.min(f1,f2)+','+Math.max(f1,f2)];c+=a<lo?(lo-a)*2:a>hi?(a-hi)*2:0}
  else{ // crossing
    if(up&&f2===1&&f1>=2&&f1<=4&&a<=5)c+=5+(f1===4?2:0)+(a>2?1:0);
    else if(!up&&f1===1&&f2>=2&&f2<=4&&a<=5)c+=5+(f2===4?2:0)+(a>2?1:0);
    else c+=25}
  if(isBlack(m2)&&f2===1)c+=4;if(isBlack(m2)&&f2===5)c+=1;if(f2===4||f2===5)c+=.1;
  return c}
function autoFinger(ms,lh,ds){ds=ds||[];const n=ms.length;if(!n)return[];const cost=[[0,0,0,0,0]],back=[[]];
  cost[0]=[1,2,3,4,5].map(f=>(isBlack(ms[0])&&f===1?4:0)+(f===1||f===2?0:.5));
  for(let i=1;i<n;i++){cost[i]=[];back[i]=[];for(let f2=1;f2<=5;f2++){let best=Infinity,bf=1;for(let f1=1;f1<=5;f1++){const c=cost[i-1][f1-1]+stepCost(ms[i-1],f1,ms[i],f2,lh,(ds[i-1]||1)>=2);if(c<best){best=c;bf=f1}}cost[i][f2-1]=best;back[i][f2-1]=bf}}
  let f=1+cost[n-1].indexOf(Math.min(...cost[n-1]));const out=[f];for(let i=n-1;i>0;i--){f=back[i][f-1];out.unshift(f)}return out}
function fingersFor(ex){if(ex.nof)return [];if(ex.f)return ex.f.split(' ').map(Number);const ns=parseNotes(ex.n);return autoFinger(ns.map(x=>x.m),ex.h==='LH',ns.map(x=>x.d))}

// flatten a song (subset of lines) into an exercise
function songEx(id,from=0,to){const s=SONGS[id];to=to==null?s.lines.length-1:to;const ls=s.lines.slice(from,to+1);const n=ls.join(' ');const lineStarts=[];let c=0;ls.forEach(l=>{lineStarts.push(c);c+=l.trim().split(/\s+/).length});
  const part=(from===0&&to===s.lines.length-1)?'full':(from===to?`line ${from+1}`:`lines ${from+1} to ${to+1}`);
  return {t:s.t,part,h:'RH',n,bpm:s.bpm,song:id,film:s.film,lineStarts}}

// random note caller (deterministic per seed)
function callerNotes(seed,count,black,lo=60,hi=71){let x=seed*9301+49297;const r=()=>(x=(x*9301+49297)%233280)/233280;const out=[];while(out.length<count){const m=lo+Math.floor(r()*(hi-lo+1));if(!black&&isBlack(m))continue;if(out.length&&out[out.length-1]===m)continue;out.push(m)}return out.map(m=>midiName(m)+':2').join(' ')}

// Rhythm specs
function rhythmSpec(code,wi){const base={bpm:60+Math.min(40,wi*4),beats:4,how:'Count 1 2 3 4 out loud. Clap or press C on every click. Raise by 5 only after two clean minutes.'};
  if(code==='rhythm:60e')return {bpm:60,beats:4,how:'Eighth notes: say "1 and 2 and 3 and 4 and". Two notes per click.'};
  if(code==='rhythm:60w')return {bpm:60,beats:3,how:'3/4: count 1 2 3. Accent 1. This is the feel of Lag Ja Gale.'};
  if(code==='rhythm:70')return {bpm:70,beats:4,how:'Clap the rhythm of Happy Birthday first, then play it on the click.'};
  if(code==='rhythm:60')return {bpm:60,beats:4,how:'Whole note: hold for 4 clicks. Half: 2. Quarter: 1. Play C each way.'};
  return base}
function mk(type,title,minutes,extra){return Object.assign({type,title,minutes},extra)}

    if(id==='call2')return {nof:1,t:'Note caller: black keys too',h:'RH',n:callerNotes(n+7,12,true),bpm:40,how:['Black keys now. C# and Db are the same key.']};
    if(id==='scaleCall'){const roots=callerNotes(n,8,false,60,71);return {nof:1,t:'Scale caller',h:'RH',n:roots,bpm:40,how:['A scale name appears. Within 5 seconds, play its first note, then the whole scale for yourself.','The mic checks the first note. Be honest about the rest, as PIX says.']}}
    if(id==='chordCall'){return {nof:1,t:'Chord caller',h:'RH',n:callerNotes(n+3,8,true,57,69),bpm:40,how:['Play the root of each chord that lights up, then the full chord (1-5-8 major, 1-4-8 minor).','The mic checks the root note.']}}
    const e=EX[id];return Object.assign({},e,{bpm:e.bpm+bump})};
  const warmMin=5,techMin=tech?9:0;
  if(tip==='posture')blocks.push(mk('self','Posture check',2,{items:POSTURE}));
  blocks.push(mk('ex','Warm-up',warmMin,{ex:ex(warm),cue:HAND_RULES[(n-1)%HAND_RULES.length]}));
  if(tech)blocks.push(mk('ex','Technique',techMin,{ex:ex(tech),gate:gate==='k'}));
  if(nw){if(typeof nw==='string'&&nw.startsWith('rhythm'))blocks.push(mk('rhythm','Rhythm',6,{rhythm:rhythmSpec(nw,wi)}));
    else if(typeof nw==='string')blocks.push(mk('ex','New today',7,{ex:ex(nw),gate:gate==='x'}));
    else blocks.push(mk('self','New today',7,{items:nw}))}
  else blocks.push(mk('rhythm','Rhythm',5,{rhythm:rhythmSpec('',wi)}));

const SYNTH_MIC=new URLSearchParams(location.search).get('mic')==='synth';
let AC=null,analyser=null,micStream=null,synthBus=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();synthBus=AC.createGain();synthBus.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function pluck(m,when,dur,vol=.28){const c=ac();const f=midiToFreq(m);const g=c.createGain();g.connect(synthBus);
  g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.008);g.gain.exponentialRampToValueAtTime(vol*.35,when+.25);g.gain.exponentialRampToValueAtTime(.0008,when+Math.max(.5,dur)+.6);
  [[1,1],[2,.45],[3,.22],[4,.1]].forEach(([h,a])=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f*h;const og=c.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(when);o.stop(when+dur+1.3)})}
function chime(){const c=ac();[72,79].forEach((m,i)=>pluck(m,c.currentTime+i*.18,.6,.12))}
function click(when,accent){const c=ac();const o=c.createOscillator();const g=c.createGain();o.frequency.value=accent?1500:1000;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.4,when+.002);g.gain.exponentialRampToValueAtTime(.0001,when+.05);o.connect(g);g.connect(AC.destination);o.start(when);o.stop(when+.06)}

/* =========================================================
   5. Pitch detection (McLeod Pitch Method) + listener + wait mode
   ========================================================= */
function mpm(x,sr,minF=60,maxF=2200,k=.9){const N=x.length;const maxLag=Math.min(N-1,Math.floor(sr/minF));const minLag=Math.max(2,Math.floor(sr/maxF));const nsdf=new Float32Array(maxLag+2);
  for(let tau=0;tau<=maxLag+1;tau++){let acf=0,m=0;for(let j=0;j<N-tau;j++){acf+=x[j]*x[j+tau];m+=x[j]*x[j]+x[j+tau]*x[j+tau]}nsdf[tau]=m>0?2*acf/m:0}
  const peaks=[];let tau=1;while(tau<maxLag&&nsdf[tau]>0)tau++;
  while(tau<maxLag){while(tau<maxLag&&nsdf[tau]<=0)tau++;let best=-1,bt=-1;while(tau<maxLag&&nsdf[tau]>0){if(nsdf[tau]>best){best=nsdf[tau];bt=tau}tau++}if(bt>=minLag)peaks.push(bt)}
  if(!peaks.length)return null;let top=0;for(const p of peaks)top=Math.max(top,nsdf[p]);const p=peaks.find(p=>nsdf[p]>=k*top);
  const a=nsdf[p-1],b=nsdf[p],c=nsdf[p+1];const den=a-2*b+c;const sh=den!==0?.5*(a-c)/den:0;return {freq:sr/(p+sh),clarity:Math.min(1,b-.25*(a-c)*sh)}}
function rmsOf(x){let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];return Math.sqrt(s/x.length)}

const Ear={on:false,buf:null,noise:.003,env:0,envMin:1,armed:true,handlers:new Set(),muteUntil:0,last:null,frame:0};
async function openMic(){
  const c=ac();
  if(analyser)return true;
  analyser=c.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0;Ear.buf=new Float32Array(analyser.fftSize);
  if(SYNTH_MIC){synthBus.connect(analyser);return true}
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}})}
  catch(e){analyser=null;return false}
  c.createMediaStreamSource(micStream).connect(analyser);return true}
async function calibrate(ms=900){const samples=[];const end=performance.now()+ms;while(performance.now()<end){analyser.getFloatTimeDomainData(Ear.buf);samples.push(rmsOf(Ear.buf));await new Promise(r=>setTimeout(r,30))}
  samples.sort((a,b)=>a-b);Ear.noise=Math.max(SYNTH_MIC?.0005:.002,samples[Math.floor(samples.length*.9)]||.002);return Ear.noise}
function earStart(){if(Ear.on)return;Ear.on=true;requestAnimationFrame(earTick)}
function earStop(){Ear.on=false}
function earTick(){if(!Ear.on)return;requestAnimationFrame(earTick);if((Ear.frame++)%2)return; // ~30fps
  analyser.getFloatTimeDomainData(Ear.buf);const level=rmsOf(Ear.buf);const gate=Ear.noise*S.settings.sens;
  Ear.env=.6*Ear.env+.4*level;Ear.envMin=Math.min(Ear.envMin*1.02+1e-5,Ear.env);let onset=false;
  if(Ear.armed&&Ear.env>gate&&Ear.env>Ear.envMin*1.8){onset=true;Ear.armed=false}
  if(!Ear.armed&&Ear.env<Ear.envMin*1.2+gate*.5)Ear.armed=true;if(onset)Ear.envMin=Ear.env;
  let midi=null,freq=0;const muted=!SYNTH_MIC&&performance.now()<Ear.muteUntil;
  if(level>gate&&!muted){const r=mpm(Ear.buf,AC.sampleRate);if(r&&r.clarity>.8){freq=r.freq;midi=Math.round(69+12*Math.log2(freq/440))}}
  const f={t:performance.now(),rms:level,gate,midi,freq,onset:onset&&!muted};Ear.last=f;Ear.handlers.forEach(h=>h(f))}

function createWaitMode(targets,ui,start=0){const holdMs=110,wrongHoldMs=160;
  const s={i:start,wrong:0,wrongAt:targets.map(()=>0),cand:null,candSince:0,strike:0,used:-1,wrongCounted:-1};
  const matches=(h,w)=>h===w||(w<60&&Math.abs(h-w)===12);
  function onFrame(f){if(s.i>=targets.length)return;if(f.onset)s.strike++;if(f.midi==null){s.cand=null;return}
    if(f.midi!==s.cand){s.cand=f.midi;s.candSince=f.t}const held=f.t-s.candSince;const want=targets[s.i];
    if(matches(s.cand,want)){if(held>=holdMs&&s.used!==s.strike){s.used=s.strike;ui.correct(s.i);s.i++;if(s.i<targets.length)ui.next(s.i);else ui.done(summary())}}
    else if(held>=wrongHoldMs&&s.wrongCounted!==s.strike&&s.used!==s.strike){s.wrongCounted=s.strike;s.wrong++;s.wrongAt[s.i]++;ui.wrong(s.cand,want,s.i)}}
  function summary(){const n=targets.length;return {notes:n,wrong:s.wrong,accuracy:Math.round(100*n/(n+s.wrong)),wrongAt:s.wrongAt}}
  function skip(){if(s.i>=targets.length)return;s.wrong++;s.wrongAt[s.i]++;s.used=s.strike;ui.correct(s.i,true);s.i++;if(s.i<targets.length)ui.next(s.i);else ui.done(summary())}
  return {onFrame,summary,skip,state:s}}

function keyboardHTML(lo,hi){
  // snap to C..B range
  lo=lo-((lo%12+12)%12);hi=hi+(11-((hi%12+12)%12));
  let whites=[],blacks=[];let wi=0;
  for(let m=lo;m<=hi;m++){if(isBlack(m)){blacks.push({m,wi})}else{whites.push(m);wi++}}
  const n=S.settings.notation;
  const w=whites.map(m=>{const lab=n==='sargam'?`<b>${sargamOf(m)}</b>`:n==='letters'?`<b>${letterOf(m)}</b>`:`<b>${letterOf(m)}</b><span>${sargamOf(m)}</span>`;return `<div class="kw${m===60?' mc':''}" data-m="${m}">${lab}</div>`}).join('');
  const b=blacks.map(({m,wi})=>`<div class="kb_" data-m="${m}" style="left:calc(var(--kw,44px)*${wi} - var(--kw,44px)*.31 - ${wi>0?0:0}px)"></div>`).join('');
  return `<div class="kbwrap"><div class="kb">${w}${b}</div></div>`}

function snapEx(ex){const o={};['t','h','n','f','bpm','how','song','part','film','lineStarts','nof'].forEach(k=>{if(ex[k]!=null)o[k]=ex[k]});return o}
function updateSkill(b,sum){if(!b.ex||sum.self)return;const k=bestKey(b);const sk=S.skills[k]||{box:0,ex:snapEx(b.ex),base:b.ex.bpm};
  const acc=sum.accuracy;sk.box=acc>=90?Math.min(5,sk.box+1):acc<70?1:Math.max(1,sk.box);sk.due=addDays(todayKey(),INTERVALS[sk.box]);sk.last=todayKey();sk.acc=acc;sk.wrongAt=sum.wrongAt||[];
  if(!b.review&&!b.fix)sk.ex=snapEx(b.ex);S.skills[k]=sk}
function fixLoop(ex,wrongAt){const ns=parseNotes(ex.n);let wi=0,wmax=-1;(wrongAt||[]).forEach((w,i)=>{if(w>wmax){wmax=w;wi=i}});if(wmax<=0)return null;
  const a=Math.max(0,wi-2),z=Math.min(ns.length,wi+3);const chunk=ns.slice(a,z);const fs=fingersFor(ex).slice(a,z);
  const rep=[...chunk,...chunk,...chunk];const n=rep.map(x=>midiName(x.m)+(x.d!==1?':'+x.d:'')).join(' ');
  return {t:'Fix-it loop: '+ex.t,h:ex.h,n,f:fs.length===chunk.length?[...fs,...fs,...fs].join(' '):undefined,bpm:Math.max(40,(ex.bpm||60)-15),lineStarts:[0,chunk.length,chunk.length*2],
    how:[`Only the ${chunk.length} notes around your trouble spot, ${letterOf(ns[wi].m)} / ${sargamOf(ns[wi].m)}. Three times.`,'Slower than feels needed. Three clean times in a row, then move on.']}}
function composeDay(n){const base=DAYS[n-1];const day=Object.assign({},base,{blocks:base.blocks.map(b=>Object.assign({},b))});
  const yKey=S.lastTest&&S.lastTest.day<n?S.lastTest:null;
  const inject=[];
  const baseKeys=new Set(day.blocks.filter(b=>b.ex).map(b=>bestKey(b)));
  if(yKey){const yEx=S.skills[yKey.key]?S.skills[yKey.key].ex:null;const dup=baseKeys.has(yKey.key);
    if(yEx&&!(dup&&!fixLoop(yEx,yKey.wrongAt))){const fx=(yKey.acc<90||dup)?fixLoop(yEx,yKey.wrongAt):null;
      inject.push(fx?mk('ex','Fix yesterday',4,{ex:fx,fix:true,why:'Yesterday had a trouble spot. Fix only that bit, slowly.'})
                 :mk('ex','Yesterday, cold',4,{ex:Object.assign({},yEx,{how:['Play it once from memory, before any Hear it. Recalling it is what makes it stick.','Then once more, a little faster.']}),review:true,why:'Play yesterday\'s test once from memory.'}))}}
  // spaced review: due skills, not yesterday's, not today's gate
  const todayKeys=new Set(day.blocks.filter(b=>b.ex).map(b=>bestKey(b)));if(yKey)todayKeys.add(yKey.key);
  const due=Object.entries(S.skills).filter(([k,s])=>!todayKeys.has(k)&&s.due<=todayKey()).sort((a,b)=>a[1].box-b[1].box||(a[1].acc||0)-(b[1].acc||0));
  if(due.length){const [k,s]=due[0];const ex=Object.assign({},s.ex,{bpm:(s.base||s.ex.bpm||60)+5*Math.max(0,s.box-1),how:['Review from an earlier day. Mixing old with new is harder, and that is why it sticks.',`Level ${s.box} of 5. Clean at 90% moves it up a level and adds 5 bpm.`]});
    inject.push(mk('ex','Review',4,{ex,review:true,why:'An older item that is due again.'}))}
  // insert: yesterday after warm-up, review before song
  const wi=day.blocks.findIndex(b=>b.title==='Warm-up');const si=day.blocks.findIndex(b=>/^Song/.test(b.title));
  const yb=inject.find(b=>b.title!=='Review'),rb=inject.find(b=>b.title==='Review');
  if(rb&&si>=0)day.blocks.splice(si,0,rb);if(yb)day.blocks.splice(wi+1,0,yb);
  fit(day);day.minutes=day.blocks.reduce((a,b)=>a+b.minutes,0);return day}
function statBar(){return `<div class="statbar"><div class="stati day">${IC.cal}<span>Day ${Math.min(90,S.unlocked)}</span></div><div class="stati fire">${IC.fire}<span>${streak()}</span></div><div class="stati xp">${IC.gem}<span>${S.xp||0} XP</span></div></div>`}
function unitBanner(wi,withBtn){const w=WEEKS[wi];const [c,d]=UNIT_COLORS[wi%UNIT_COLORS.length];
  return `<div class="unit" style="background:${c};box-shadow:0 4px 0 ${d}"><div style="flex:1;min-width:0"><div class="eyebrow">Week ${wi+1} of 13</div><h2>${esc(w.theme)}</h2><p>${esc(w.goal)}</p></div>${withBtn?`<button class="ubtn" data-tab="plan" aria-label="Open the plan">${IC.book}</button>`:''}</div>`}
function nodeIcon(d){if(d.milestone)return IC.trophy;if(d.d===7)return IC.star;return IC.note}

function todayHTML(){
  const n=currentDayNum();const day=composeDay(n);const allDone=S.days[90]&&S.days[90].passed;
  const passedToday=Object.entries(S.days).filter(([k,v])=>v.passed&&v.date===todayKey()).map(([k])=>+k);
  const lastDone=passedToday.length?passedToday[passedToday.length-1]:0;
  const wi=day.week-1;const weekDays=DAYS.filter(d=>d.week===day.week);
  const offs=[0,48,72,48,0,-48,-72];
  const nodes=weekDays.map((d,i)=>{const st=S.days[d.n];const done=st&&st.passed;const cur=d.n===n&&!allDone;const locked=d.n>S.unlocked;
    return `<div style="transform:translateX(${offs[i%7]}px)"><button class="node ${done?'done':cur?'cur':'locked'}" data-node="${d.n}" aria-label="Day ${d.n}">${cur&&!(lastDone&&lastDone!==n)?'<span class="bubble">START</span>':''}${done?IC.check:locked?(d.milestone?IC.trophy:IC.lock):nodeIcon(d)}<span class="lbl">Day ${d.n}</span></button></div>`}).join('');
  const dows=['M','T','W','T','F','S','S'];const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const week=dows.map((l,i)=>{const dd=new Date(mon);dd.setDate(mon.getDate()+i);const k=ukey(dd);return `<div class="wd${S.practice.includes(k)?' done':''}${k===todayKey()?' today':''}"><b>${IC.check.replace('stroke-width="3.5"','stroke-width="4" width="16" height="16"')}</b>${l}</div>`}).join('');
  const resumable=S.days[n]&&S.days[n].session&&S.days[n].session.date===todayKey();
  const early=lastDone&&lastDone!==n;
  const startLabel=resumable?`Continue Day ${n}`:early?`Start Day ${n} early`:`Start Day ${n}`;
  const blocks=day.blocks.map((b,i)=>`<li><span class="bn" style="background:${blockColor(b)}">${i+1}</span><span class="bt"><b>${esc(b.title)} ${b.gate?'<span class="gate-tag">Test</span>':''}</b><span>${esc(blockSub(b))}</span></span><span class="bm">${b.minutes}m</span></li>`).join('');
  const doneCard=early?`<section class="card pad row" style="margin-top:16px;border-color:var(--ok);background:var(--ok-soft)"><div class="bn" style="background:var(--ok);width:48px;height:48px">${IC.check.replace('<svg','<svg width="26" height="26"')}</div><div style="flex:1"><h2>Done for today</h2><div class="small muted">Day ${lastDone} passed with ${S.days[lastDone].best}%. Rest is part of practice.</div></div></section>`:'';
  return `${statBar()}${unitBanner(wi,true)}
  ${doneCard}
  <div class="path">${nodes}</div>
  <section class="card pad" style="margin-top:20px">
    <div class="row" style="align-items:flex-start"><div style="flex:1"><div class="eyebrow">Day ${n} · ${day.minutes} minutes</div><h2 style="font-size:22px;font-weight:800;margin-top:4px">${esc(day.title)}</h2></div></div>
    <ul class="blocks" style="margin-top:8px">${blocks}</ul>
    ${day.video?`<a class="vlink" style="margin-top:12px" href="${day.video.u}" target="_blank" rel="noopener">${ICON.yt}<span>${esc(day.video.t)}</span></a>`:''}
    <p class="tiny" style="margin-top:8px">Pass the test with ${S.settings.pass}% to unlock Day ${Math.min(90,n+1)}.</p>
  </section>
  <details class="card pad" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700;list-style:none" class="row"><span style="flex:1">How each class works</span><span class="pill sky">Why</span></summary>
    <ol class="how" style="margin-top:10px">
      <li><b>Warm-up.</b> Slow five-finger playing to loosen the hands.</li>
      <li><b>Yesterday, cold.</b> Play yesterday's test once from memory. Recalling it is what makes it stick. If it had mistakes, you get a fix-it loop on just the trouble spot.</li>
      <li><b>Technique and New today.</b> One new thing, slow, in small pieces.</li>
      <li><b>Review.</b> One older item that is due again. Clean items come back after 1, 2, 4, 7, then 14 days, 5 bpm faster each time. Shaky ones come back tomorrow.</li>
      <li><b>Song.</b> Always last, so you finish on music.</li>
    </ol></details>
  <section class="card pad stack" style="margin-top:16px"><div class="row"><h2 style="flex:1">This week</h2><span class="tiny">${S.practice.length} days practised</span></div><div class="week">${week}</div></section>
  ${!allDone?`<div class="startbar no-print"><button class="btn ${early?'btn-line':'btn-accent'} btn-block" data-start="${n}">${startLabel}</button></div>`:''}`;
}
function blockSub(b){if(b.type==='ex'){return b.ex.t+(b.ex.part&&b.ex.part!=='full'?', '+b.ex.part:'')}if(b.type==='rhythm')return `Metronome ${b.rhythm.bpm} bpm, ${b.rhythm.beats} beats`;return b.items?b.items[0]:''}

function planHTML(){
  let html=`${statBar()}<header class="stack"><h1>The 90-day course</h1><p class="muted">One 30-minute class a day. Each day opens when you pass the one before. Tap a day to see what is new that day. Every class also opens with yesterday's test played from memory, and mixes in one older item that is due for review.</p>
  <button class="btn btn-line btn-sm no-print" id="printPlan">Print the plan</button></header>`;
  WEEKS.forEach((w,wi)=>{const days=DAYS.filter(d=>d.week===wi+1);if(!days.length)return;
    html+=`<section class="wk">${unitBanner(wi,false)}`;
    days.forEach(d=>{const st=S.days[d.n];const locked=d.n>S.unlocked;const cur=d.n===S.unlocked;const done=st&&st.passed;
      const stat=done?`<span class="pill ok">${st.best}%</span>`:cur?`<span class="pill accent">Today</span>`:locked?`<span class="dstat" style="color:var(--ink-3)">${IC.lock.replace('<svg','<svg width="18" height="18"')}</span>`:'';
      html+=`<button class="dayrow${locked?' locked':''}${cur?' cur':''}${done?' done':''}" data-day="${d.n}"><span class="dnum">${d.n}</span><span style="flex:1;min-width:0"><b style="font-weight:700;font-size:16px">${esc(d.title)}</b><span class="tiny" style="display:block">${d.minutes} min${d.milestone?' · milestone test':''}</span></span>${stat}</button>`;
      if(planOpen===d.n){html+=`<div class="daydetail"><ol>${d.blocks.map(b=>`<li><b>${esc(b.title)}</b> (${b.minutes} min): ${b.type==='self'?esc(b.items.join(' ')):esc(blockSub(b))+(b.items&&b.items.length?'. '+esc(b.items.join(' ')):'')}</li>`).join('')}</ol>
        ${!locked?`<button class="btn btn-accent btn-sm no-print" style="margin-top:10px" data-start="${d.n}">${done?'Redo':'Start'} Day ${d.n}</button>`:`<p class="tiny" style="margin-top:8px">Finish Day ${S.unlocked} to get here.</p>`}</div>`}
    });html+='</section>'});
  return html}

const TIER_COLORS=['#1FBF86','#3BA8FF','#8B6CFF','#FF7A45','#FF4D6D'];
const TIER_DAY=[22,36,57,78,91];
let songTier=0,songQuery='';

function libRows(){const q=songQuery.trim().toLowerCase();
  const list=CATALOG.filter(s=>(!songTier||s.d===songTier)&&(!q||(s.t+' '+s.f).toLowerCase().includes(q))).slice(0,songTier||q?400:60);
  if(!list.length)return '<p class="muted" style="padding:12px 0">No songs match.</p>';
  return list.map(s=>{const ready=S.unlocked>=TIER_DAY[s.d-1];const views=s.w>=1e6?(s.w/1e6).toFixed(1)+'M':s.w>=1e3?Math.round(s.w/1e3)+'K':s.w||'';
    return `<div class="songrow"><span class="tier" style="background:${TIER_COLORS[s.d-1]}">${s.d}</span><span style="flex:1;min-width:0"><b class="ell" style="font-weight:700">${esc(s.t)}</b><span class="tiny ell">${esc([s.f,s.y].filter(Boolean).join(' · '))}${views?` · ${views} views`:''}</span></span>${s.v?`<a class="mini" href="${s.v}" target="_blank" rel="noopener" aria-label="Video tutorial">${ICON.yt}</a>`:'<span class="mini" style="visibility:hidden"></span>'}${s.n?`<a class="mini" href="${s.n}" target="_blank" rel="noopener" aria-label="Notation">${IC.book}</a>`:''}</div>`}).join('')+(!songTier&&!q&&CATALOG.length>60?`<p class="tiny" style="padding:12px 0">Showing the top 60. Pick a level or search to see all ${CATALOG.length}.</p>`:'')}

function bindOnboard(){
  const nx=$('#obNext');if(nx)nx.onclick=()=>{onboardHTML.step=(onboardHTML.step||0)+1;render()};
  const kb=$('#obKb');if(kb){const k=keyEl(kb,60);k&&k.classList.add('k-target')}
  const kb2=$('#obKb2');if(kb2){const k=keyEl(kb2,60);k&&k.classList.add('k-hear')}
  const mb=$('#obMic');if(mb)mb.onclick=async()=>{const ok=await startMicWithCalib($('#heardS'));if(!ok)return;$('#heardS').textContent='Now play middle C';
    let got=false;const h=f=>{updMeter(f);if(f.midi!=null){$('#heard').textContent=letterOf(f.midi)+octOf(f.midi);const k=kb2&&keyEl(kb2,f.midi);if(k){kb2.querySelectorAll('.k-ok').forEach(e=>e.classList.remove('k-ok'));k.classList.add('k-ok')}
      if(f.midi===60&&!got){got=true;$('#heardS').innerHTML='<span class="say ok">Heard Sa (C4). You are ready.</span>';const d=$('#obDone');if(d){d.className='btn btn-primary btn-block';d.textContent='Start Day 1'}}else if(!got){$('#heardS').textContent=`Heard ${sargamOf(f.midi)}. Find middle C.`}}};
    Ear.handlers.add(h);onboardHTML._h=h};
  const dn=$('#obDone');if(dn)dn.onclick=()=>{if(onboardHTML._h)Ear.handlers.delete(onboardHTML._h);S.onboarded=true;save();render()};
}
async function startMicWithCalib(statusEl){statusEl&&(statusEl.textContent='Opening mic…');const ok=await openMic();
  if(!ok){statusEl&&(statusEl.textContent='Mic blocked. Allow it in the browser address bar.');toast('Mic not available');return false}
  if(!Ear.calibrated){statusEl&&(statusEl.textContent='Stay quiet for a second…');await calibrate();Ear.calibrated=true}
  earStart();return true}
function updMeter(f){const m=$('#mtr');if(m)m.style.height=Math.min(100,f.rms/Math.max(f.gate,1e-4)*35)+'%'}

  SES={n,day,bi:prev?prev.bi:0,started:Date.now(),blockStart:Date.now(),scores:prev?prev.scores:{},progress:prev?prev.progress||{}:{},selfDone:{},notesPlayed:0,wrong:0};
  if(!prev)rec.attempts++;save();wake(true);

function selfHTML(items,inner){const key=SES.bi;return (inner?'':'<div class="card pad">')+items.map((t,i)=>{const on=SES.selfDone[key+':'+i];return `<button class="check${on?' on':''}" data-chk="${key}:${i}"><span class="box"></span><span>${esc(t)}</span></button>`}).join('')+(inner?'':'</div>')}

function exHTML(b){const ex=b.ex;const notes=parseNotes(ex.n);const fingers=fingersFor(ex);

  const how=ex.how||(ex.song?['Tap "Hear it" once. Then press "Check me" and play along.','The small number above each note is the finger to use: 1 is the thumb, 5 is the little finger.',ex.film?'Notes come from fan notation, moved to Sa = C. If one sounds off against the song, trust your ear.':'Say the sargam in your head as you play.']:[]);

    <h1 style="font-size:28px;margin-top:2px">${esc(ex.t)}</h1>${b.why?`<p class="muted small" style="margin-top:-4px">${esc(b.why)}</p>`:''}
    <details class="howbox"${S.howOpen===false?'':' open'}><summary>How to play</summary><ol class="how">${how.map(h=>`<li>${esc(h)}</li>`).join('')}</ol></details>
    <div class="hero" id="hero"><div class="hero-note" id="heroNote"></div><div class="hero-side"><div class="hero-f" id="heroF"></div><div class="hero-say" id="say">${b.gate?'Today\'s test. Press Check me and play.':'Press Check me and play along.'}</div></div><div class="meter"><i id="mtr"></i></div></div>
    <div class="stripwrap"><div class="strip" id="strip">${chips}</div></div>

    <div id="exResult"></div>
    <div id="selfWrap" hidden><button class="btn btn-line btn-sm" id="selfOk">No mic: I played it cleanly 3 times</button></div>`}
function bestKey(b){return b.ex.song?'song:'+b.ex.song+':'+(b.ex.part||'full'):'ex:'+b.ex.t}
let checkState=null;
document.addEventListener('keydown',e=>{if(!SES)return;if(e.code==='Space'&&$('#check')){e.preventDefault();$('#check').click()}else if(e.code==='ArrowRight'&&$('#sNext')){$('#sNext').click()}});
function bindEx(b){const ex=b.ex;const notes=parseNotes(ex.n);const fingers=fingersFor(ex);const strip=$('#strip'),kbx=$('#kbx');
  const chipAt=i=>strip.querySelector(`.chip[data-i="${i}"]`);
  const hero=$('#hero'),heroNote=$('#heroNote'),heroF=$('#heroF'),say=$('#say');
  const setHero=(i,state)=>{const n=notes[i];if(!n){heroNote.textContent='✓';heroF.textContent='';return}const L=noteLabel(n.m);heroNote.innerHTML=`${esc(L.big)}${L.small?`<small>${esc(L.small)}</small>`:''}`;heroF.textContent=fingers[i]?`Finger ${fingers[i]}`:'';hero.className='hero'+(state?' '+state:'')};
  const setCur=i=>{strip.querySelectorAll('.chip').forEach(c=>c.classList.toggle('cur',+c.dataset.i===i));const c=chipAt(i);if(c)strip.scrollLeft=c.offsetLeft-strip.clientWidth/2+c.clientWidth/2;
    kbx.querySelectorAll('.k-target').forEach(e=>e.classList.remove('k-target'));if(notes[i]){const k=keyEl(kbx,notes[i].m);if(k){k.classList.add('k-target');const w=kbx.querySelector('.kbwrap');w.scrollLeft=k.offsetLeft-w.clientWidth/2}}setHero(i)};
  const prog=SES.progress[SES.bi]||{i:0,wrong:0,wrongAt:notes.map(()=>0)};
  for(let i=0;i<prog.i;i++){const c=chipAt(i);c&&c.classList.add('ok')}
  setCur(prog.i);
  const hearBtn=$('#hear'),checkBtn=$('#check');
  hearBtn.onclick=()=>{if(checkState){toast('Stop the check first');return}const c=ac();const beat=60/ex.bpm;let t=c.currentTime+.15;const start=t;
    notes.forEach((x,i)=>{pluck(x.m,t,x.d*beat);const at=(t-start)*1000;setTimeout(()=>{setCur(i);flashKey(kbx,x.m,'k-ok',Math.max(150,x.d*beat*900))},at);t+=x.d*beat});
    Ear.muteUntil=performance.now()+(t-start)*1000+600;setTimeout(()=>setCur(SES.progress[SES.bi]?SES.progress[SES.bi].i:0),(t-start)*1000+200)};
  checkBtn.onclick=async()=>{if(checkState){stopCheck();return}
    const ok=await startMicWithCalib(say);if(!ok){say.textContent='Mic not available.';$('#selfWrap').hidden=false;return}
    let startI=0,carry={wrong:0,wrongAt:notes.map(()=>0)};const pr=SES.progress[SES.bi];
    if(pr&&pr.i>0&&pr.i<notes.length){startI=pr.i;carry=pr}else{strip.querySelectorAll('.chip').forEach(c=>c.classList.remove('ok','miss'));$('#exResult').innerHTML=''}
    setCur(startI);checkBtn.textContent='Stop';checkBtn.classList.add('live');say.className='hero-say';say.textContent=startI?'Picking up where you stopped.':'Play the highlighted key.';
    let missesHere=0;
    const wm=createWaitMode(notes.map(x=>x.m),{
      next:i=>{missesHere=0;$('#skipN').hidden=true;setCur(i);say.className='hero-say';say.textContent=i===startI?'':'';SES.progress[SES.bi]={i:lineStartBefore(ex,i),wrong:wm.state.wrong,wrongAt:wm.state.wrongAt.slice()};saveSession()},
      correct:(i,skipped)=>{const c=chipAt(i);c&&c.classList.add(skipped?'miss':'ok');if(!skipped){flashKey(kbx,notes[i].m,'k-ok',250);hero.className='hero ok';setTimeout(()=>hero.classList.remove('ok'),220)}},
      wrong:(heard,want,i)=>{missesHere++;const c=chipAt(i);c&&c.classList.add('miss');flashKey(kbx,heard,'k-bad',500);hero.className='hero bad';say.className='hero-say bad';say.textContent=direction(heard,want);if(missesHere>=4)$('#skipN').hidden=false},
      done:sum=>{stopCheck(false);delete SES.progress[SES.bi];kbx.querySelectorAll('.k-target').forEach(e=>e.classList.remove('k-target'));strip.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));setHero(-1);recordScore(b,sum);showExResult(b,sum);saveSession()}},startI);
    wm.state.wrong=carry.wrong||0;wm.state.wrongAt=(carry.wrongAt||notes.map(()=>0)).slice();
    const h=f=>{updMeter(f);const ss=$('#sayS');if(ss&&f.midi!=null)ss.textContent='Heard: '+spoken(f.midi);wm.onFrame(f)};
    checkState={h,wm};document.body.classList.add('listening');Ear.handlers.add(h);$('#skipN').onclick=()=>wm.skip();
    if(SYNTH_MIC)window.__autoplay&&window.__autoplay(notes.slice(startI),ex.bpm)};
  $('#selfOk').onclick=()=>{const sum={notes:notes.length,wrong:0,accuracy:S.settings.pass,self:true};recordScore(b,sum);showExResult(b,sum);saveSession()};
}
function lineStartBefore(ex,i){const ls=ex.lineStarts||[0];let r=0;for(const x of ls)if(x<=i)r=x;return r}
function direction(heard,want){const d=want-heard;const W=spoken(want);
  if(Math.abs(d)%12===0&&d!==0)return `Right note, wrong octave. Play ${W} ${d>0?'higher':'lower'}.`;
  const n=Math.abs(d);return `${n===1?'One key':n+' keys'} to the ${d>0?'right':'left'}: ${W}`}
function spoken(m){const n=S.settings.notation;if(n==='letters')return midiName(m);if(n==='sargam')return sargamOf(m);return `${letterOf(m)} (${sargamOf(m)})`}
function stopCheck(){document.body.classList.remove('listening');if(checkState){Ear.handlers.delete(checkState.h);checkState=null;const c=$('#check');if(c){c.textContent='Check me';c.classList.remove('live')}}}
function recordScore(b,sum){const k=bestKey(b);S.best[k]=Math.max(S.best[k]||0,sum.accuracy);if(b.ex.song&&(b.ex.part==='full'||SES.songId))S.best['song:'+b.ex.song]=Math.max(S.best['song:'+b.ex.song]||0,sum.accuracy);
  SES.notesPlayed+=sum.notes;SES.wrong+=sum.wrong||0;
  if(b.gate){const prev=SES.scores[SES.bi];if(!prev||sum.accuracy>prev.accuracy)SES.scores[SES.bi]=sum;if(SES.n&&!sum.self)S.lastTest={day:SES.n,key:bestKey(b),acc:Math.max(sum.accuracy,(S.lastTest&&S.lastTest.day===SES.n&&S.lastTest.key===bestKey(b))?S.lastTest.acc:0),wrongAt:sum.wrongAt}}
  updateSkill(b,sum);save();logPractice()}
function showExResult(b,sum){const pass=sum.accuracy>=S.settings.pass;const notes=parseNotes(b.ex.n);
  const worst=(sum.wrongAt||[]).map((w,i)=>({w,i})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,3).map(x=>spoken(notes[x.i].m)+(x.w>1?' ×'+x.w:'')).join(', ');
  const head=sum.self?'Self-checked':pass?(b.gate?'Test passed.':'Clean.'):'Not yet. Once more, slower.';
  $('#exResult').innerHTML=`<div class="result ${pass?'ok':'bad'}"><div class="display">${sum.accuracy}%</div><div style="flex:1"><b>${head}</b><div class="small">${sum.self?'Marked by you, counted at the pass mark.':`${sum.notes} notes, ${sum.wrong} wrong${worst?'. Trouble spots: '+worst:''}`}</div></div></div>`;
  const say=$('#say');if(say){say.className='hero-say';say.textContent=pass?'Move on when ready.':'Tap Hear it, then try again.'}}
function saveSession(){if(!SES||!SES.n)return;const r=S.days[SES.n];if(!r)return;r.session={bi:SES.bi,scores:SES.scores,progress:SES.progress,date:todayKey(),blocks:SES.day.blocks.map(b=>Object.assign({},b,b.ex?{ex:snapEx(b.ex)}:{}))};save()}

/* rhythm block */
let metro=null;
function rhythmHTML(b){const r=b.rhythm;SES.bpm=SES.bpm||r.bpm;
  return `<div><span class="pill">${r.beats} beats</span><h1 style="font-size:30px;margin-top:10px">Rhythm</h1></div>
  <ol class="how"><li>${esc(r.how)}</li><li>Start slow. When it feels easy for a full minute, add 4 bpm.</li><li>"Check my timing" plays 4 clicks, then goes silent. Keep clapping, or tap middle C, on every beat.</li></ol>
  <div class="card pad stack"><div class="row" style="justify-content:center;gap:18px"><button class="btn btn-ghost btn-sm" id="bpmDn">−4</button><div class="bpm" id="bpm">${r.bpm}</div><button class="btn btn-ghost btn-sm" id="bpmUp">+4</button></div><div class="tiny" style="text-align:center">beats per minute</div>
  <div class="beats" id="beats" style="justify-content:center">${Array.from({length:r.beats},(_,i)=>`<div class="beat${i===0||(r.beats===8&&i===4)?' acc':''}">${i+1}</div>`).join('')}</div>
  <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="metroBtn">${ICON.play} Start metronome</button><button class="btn btn-line" id="timeBtn">Check my timing</button></div>
  <div id="rhyRes"></div></div>`}
function bindRhythm(b){let bpm=b.rhythm.bpm;const beats=b.rhythm.beats;const show=()=>$('#bpm').textContent=bpm;
  $('#bpmDn').onclick=()=>{bpm=Math.max(40,bpm-4);show();if(metro){stopMetro();startMetro(bpm,beats)}};
  $('#bpmUp').onclick=()=>{bpm=Math.min(160,bpm+4);show();if(metro){stopMetro();startMetro(bpm,beats)}};
  $('#metroBtn').onclick=()=>{if(metro){stopMetro();$('#metroBtn').innerHTML=ICON.play+' Start metronome'}else{startMetro(bpm,beats);$('#metroBtn').textContent='Stop'}};
  $('#timeBtn').onclick=async()=>{stopMetro();$('#metroBtn').innerHTML=ICON.play+' Start metronome';const ok=await startMicWithCalib($('#rhyRes'));if(!ok){$('#rhyRes').textContent='Timing check needs the mic.';return}
    const c=ac();const beat=60/bpm;const t0=c.currentTime+.3;const N=8;const perfT0=performance.now()+300;
    for(let i=0;i<4;i++)click(t0+i*beat,i===0);
    $('#rhyRes').innerHTML='<p class="say" style="text-align:center">Listen: 4 clicks. Then keep the beat on your own.</p>';
    Ear.muteUntil=0;const onsets=[];const h=f=>{if(f.onset)onsets.push(f.t)};Ear.handlers.add(h);
    const dots=[...document.querySelectorAll('#beats .beat')];
    for(let i=0;i<4+N;i++)setTimeout(()=>{dots.forEach(d=>d.classList.remove('on'));const d=dots[i%dots.length];d&&d.classList.add('on');if(i===4)$('#rhyRes').innerHTML='<p class="say" style="text-align:center">Your turn. 8 beats.</p>'},300+i*beat*1000);
    setTimeout(()=>{Ear.handlers.delete(h);dots.forEach(d=>d.classList.remove('on'));
      const targets=Array.from({length:N},(_,i)=>perfT0+(4+i)*beat*1000);let hits=0,offs=[];
      targets.forEach(t=>{const near=onsets.reduce((a,o)=>Math.abs(o-t)<Math.abs(a-t)?o:a,Infinity);const d=near-t;if(Math.abs(d)<=Math.max(90,beat*1000*.18)){hits++;offs.push(d)}});
      const avg=offs.length?offs.reduce((a,b)=>a+b,0)/offs.length:0;const pct=Math.round(hits/N*100);
      const tip=!offs.length?'I did not hear the beats. Clap louder or tap a key.':avg<-35?'You are rushing. Wait for the beat.':avg>35?'You are dragging a little. Lean into the beat.':'Steady.';
      $('#rhyRes').innerHTML=`<div class="row" style="padding:14px;border-radius:12px;background:var(--surface-2)"><div class="display" style="font-size:32px">${hits}/${N}</div><div><b>${pct>=75?'On the beat.':'Keep at it.'}</b><div class="small muted">${tip}</div></div></div>`;logPractice()},300+(4+N)*beat*1000+400)};
}
function startMetro(bpm,beats){const c=ac();const beat=60/bpm;let next=c.currentTime+.1,i=0;const dots=[...document.querySelectorAll('#beats .beat')];
  metro={int:setInterval(()=>{while(next<c.currentTime+.2){const k=i%beats;click(next,k===0||(beats===8&&k===4));const at=(next-c.currentTime)*1000;setTimeout(()=>{dots.forEach(d=>d.classList.remove('on'));dots[k]&&dots[k].classList.add('on')},at);next+=beat;i++}},50)};
  Ear.muteUntil=Infinity}
function stopMetro(){if(metro){clearInterval(metro.int);metro=null;Ear.muteUntil=0;document.querySelectorAll('#beats .beat').forEach(d=>d.classList.remove('on'))}}

/* finish */
function finishSession(){stopCheck();stopMetro();clearInterval(SES.timerInt);
  const {day}=SES;const gates=day.blocks.map((b,i)=>b.gate?i:-1).filter(i=>i>=0);
  const scored=gates.map(i=>SES.scores[i]);const missing=gates.filter(i=>!SES.scores[i]);
  const acc=scored.filter(Boolean).length?Math.round(scored.filter(Boolean).reduce((a,s)=>a+s.accuracy,0)/scored.filter(Boolean).length):0;
  const passed=!missing.length&&scored.every(s=>s.accuracy>=S.settings.pass);
  const mins=Math.max(1,Math.round((Date.now()-SES.started)/60000));
  logPractice();
  const xpGain=(SES.notesPlayed-SES.wrong)+(passed?20:0);S.xp=(S.xp||0)+Math.max(0,xpGain);
  let rec=null;if(day.n){rec=S.days[day.n];rec.best=Math.max(rec.best||0,acc);if(passed){rec.passed=true;rec.date=todayKey();delete rec.session;if(S.unlocked===day.n)S.unlocked=day.n+1}}save();
  const el=$('.session');const C=2*Math.PI*80;const col=passed?'var(--ok)':acc>=S.settings.pass-15?'var(--accent)':'var(--bad)';
  const attempts=rec?rec.attempts:0;
  let head,sub,actions;
  if(!day.n){head=passed?'Nice.':'Keep going.';sub=`${SONGS[SES.songId].t}. Practise songs any time.`;actions=`<button class="btn btn-primary btn-block" id="rDone">Done</button>`}
  else if(passed){head=day.n===90?'You did it.':`Day ${day.n} done.`;sub=day.n===90?'90 days. From finding middle C to a recital. Keep the recordings.':`Day ${day.n+1} is unlocked. Come back tomorrow, or start it now if you have time left.`;
    actions=`<button class="btn btn-accent btn-block" id="rDone">Done for today</button>${day.n<90?`<button class="btn btn-ghost btn-block" id="rNext">Start Day ${day.n+1} now</button>`:''}`}
  else if(missing.length){head='Test not taken.';sub=`Play the test block${gates.length>1?'s':''} with "Check me" to unlock the next day. ${missing.map(i=>day.blocks[i].title).join(', ')}.`;
    actions=`<button class="btn btn-accent btn-block" id="rRetry">Go to the test</button><button class="btn btn-ghost btn-block" id="rDone">Do it tomorrow</button>`}
  else{head='Almost.';sub=`You need ${S.settings.pass}%. Slow down and play it once more. Accuracy beats speed.`;
    actions=`<button class="btn btn-accent btn-block" id="rRetry">Retake the test</button><button class="btn btn-ghost btn-block" id="rDone">Repeat this day tomorrow</button>${attempts>=3?'<button class="btn btn-line btn-block" id="rSkip">Move on anyway</button>':''}`}
  el.innerHTML=`<div class="ob stack" style="text-align:center"><div class="ring"><svg width="180" height="180"><circle cx="90" cy="90" r="80" stroke="var(--surface-2)" stroke-width="12" fill="none"/><circle cx="90" cy="90" r="80" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="arc" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg><div class="v"><div><b>${missing.length?'–':acc+'%'}</b><div class="tiny">accuracy</div></div></div></div>
    <h1 style="font-size:32px;margin-top:16px">${head}</h1><p class="muted">${esc(sub)}</p>
    <div class="stats" style="margin-top:16px"><div class="stat gold"><span>Total XP</span><b>+${Math.max(0,xpGain)}</b></div><div class="stat ok"><span>Accuracy</span><b>${missing.length?'–':acc+'%'}</b></div><div class="stat sky"><span>Time</span><b>${mins}m</b></div></div>
    <div class="stack" style="margin-top:20px">${actions}</div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=$('#arc');if(a)a.style.strokeDashoffset=C*(1-(missing.length?0:acc)/100)}));
  $('#rDone').onclick=()=>{closeSession();view='today';render()};
  const rn=$('#rNext');if(rn)rn.onclick=()=>{const k=day.n+1;closeSession();startSession(k)};
  const rr=$('#rRetry');if(rr)rr.onclick=()=>{SES.bi=(missing[0]!=null?missing[0]:gates.find(i=>SES.scores[i].accuracy<S.settings.pass));renderSession()};
  const sk=$('#rSkip');if(sk)sk.onclick=()=>{rec.passed=true;rec.skipped=true;rec.date=todayKey();if(S.unlocked===day.n)S.unlocked++;save();closeSession();view='today';render();toast('Moved on. Come back to Day '+day.n+' later.')};
}

/* test hook for ?mic=synth: plays target notes into the analyser */
if(SYNTH_MIC){window.__autoplay=(notes,bpm,wrongAt=-1)=>{const c=ac();const beat=Math.max(.45,60/bpm);let t=c.currentTime+.3;notes.forEach((x,i)=>{if(i===wrongAt){pluck(x.m+2,t,beat*.8,.5);t+=beat}pluck(x.m,t,beat*.8,.5);t+=beat})};window.__S=()=>S;window.__DAYS=DAYS}

render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
